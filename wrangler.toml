name = "katelyatv"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# ============================================================
# D1 绑定
#   敏感凭据（USERNAME / AUTH_PASSWORD / SESSION_SECRET /
#   TVBOX_TOKEN / CRON_SECRET）一律不落仓库，
#   在 Cloudflare Dashboard 以加密变量（Secret）提供。
#   这里的 [vars] 仅覆盖构建/运行真正会读取的变量。
# ============================================================

# 默认绑定（Pages 直连 Git 项目时以 Dashboard 配置为准）
[[d1_databases]]
binding = "DB"
database_name = "katelyatv-db"
database_id = "16e9bc7a-aa06-40e2-9a23-e6710a161244"

[vars]
NEXT_PUBLIC_STORAGE_TYPE = "d1"
SITE_NAME = "KatelyaTV"
NEXT_PUBLIC_IMAGE_PROXY = "/api/image-proxy?url="
NODE_ENV = "production"

# 生产环境
[env.production]
name = "katelyatv"

[[env.production.d1_databases]]
binding = "DB"
database_name = "katelyatv-db"
database_id = "16e9bc7a-aa06-40e2-9a23-e6710a161244"

[env.production.vars]
NEXT_PUBLIC_STORAGE_TYPE = "d1"
SITE_NAME = "KatelyaTV"
NEXT_PUBLIC_IMAGE_PROXY = "/api/image-proxy?url="
NODE_ENV = "production"

# 预览环境（PR / 非 main 分支部署）：绑定独立的 preview 库，避免测试数据污染生产
[env.preview]
name = "katelyatv-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "katelyatv-db-preview"
database_id = "253de8dc-bc91-4362-b150-a90e0b50ea9a"

[env.preview.vars]
NEXT_PUBLIC_STORAGE_TYPE = "d1"
SITE_NAME = "KatelyaTV"
NEXT_PUBLIC_IMAGE_PROXY = "/api/image-proxy?url="
NODE_ENV = "production"
